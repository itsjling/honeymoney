[project]
name = "honeymoney"
version = "0.1.0"
description = "Local private spending categorization for household transaction exports"
requires-python = ">=3.10"
dependencies = [
  "certifi>=2026.7.22,<2027",
]

[project.optional-dependencies]
pdf = [
  "pdfplumber>=0.11.10,<0.12",
  "PyMuPDF>=1.28,<1.29",
]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.10,<8",
  "mypy>=2.3,<3",
  "pip-audit>=2.10,<3",
  "ruff>=0.12,<1",
  "setuptools>=70.1",
  "wheel>=0.45,<1",
]

[project.scripts]
honeymoney = "honeymoney.cli:run"

[tool.setuptools.packages.find]
include = ["honeymoney*"]
exclude = ["samples*", "tests*", "examples*"]

[tool.setuptools.package-data]
honeymoney = ["data/profiles/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = [
  "honeymoney/classification_policy.py",
  "honeymoney/contracts.py",
  "honeymoney/corrections.py",
  "honeymoney/csv_artifacts.py",
  "honeymoney/duplicates.py",
  "honeymoney/identity.pyi",
  "honeymoney/identity_contracts.py",
  "honeymoney/identity_state.py",
  "honeymoney/importers.pyi",
  "honeymoney/learning.py",
  "honeymoney/normalization.py",
  "honeymoney/overlap.py",
  "honeymoney/overlap_contracts.py",
  "honeymoney/parser_contracts.py",
  "honeymoney/persistence.py",
  "honeymoney/provenance.py",
  "honeymoney/reconciliation.py",
  "honeymoney/report.py",
  "honeymoney/rules.pyi",
  "honeymoney/schema.py",
  "honeymoney/source_data_review.py",
  "honeymoney/workspace_upgrade.py",
]
strict = true
disallow_any_explicit = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["honeymoney"]
parallel = true
patch = ["subprocess"]
relative_files = true

[tool.coverage.report]
fail_under = 87
precision = 2
show_missing = true
skip_covered = false
